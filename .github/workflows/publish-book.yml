on:
  push:
    branches: main
  pull_request:
    branches: main
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  schedule:
    # Weekly, Sundays at 11 PM UTC. Doubles as a dependency canary: a green run
    # refreshes the book's build date, so a current date on the site means the
    # whole book still renders against current dependencies.
    - cron: '0 23 * * 0'

name: Render and publish book

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Render book
        run: quarto render

      - name: Render slides
        run: bash render-slides.sh

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          # Publish as a single orphan commit. The site is ~150MB (mostly
          # self-contained slide decks), and date: today makes every page change
          # on each build, so retaining history would grow gh-pages indefinitely.
          # The branch is rebuilt from source every run, so its history has no value.
          force_orphan: true
